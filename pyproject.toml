[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jiostar-contract-intelligence-assistant"
version = "0.1.0"
description = "Contract Intelligence Assistant for legal agreement retrieval and clause verification"
authors = [
    { name = "Kunj Desai", email = "kunjdesai28@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "huggingface_hub>=0.20.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"
