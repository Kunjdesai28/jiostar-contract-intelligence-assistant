pipeline:
  name: candidate_final_phase4
  version: 2
chunking:
  strategy: clause_aware
  chunk_size: 1000
  overlap: 250
tokenization:
  lowercase: true
  enhancement_mode: legal_stem
retrieval:
  method: bm25
  top_k: 5
bm25:
  k1: 1.5
  b: 0.75
abstention:
  enabled: true
  strategy: normalized_score_coverage
  threshold: 0.0
  min_norm_score: 2.4
  min_words_for_guard: 5
  max_matched_for_guard: 1
evaluation:
  k_values:
  - 1
  - 3
  - 5
  - 10
  split: train
query_processing:
  mode: two_stage
