# JioStar Contract Intelligence Assistant - Baseline Retrieval Configuration
pipeline:
  name: "bm25_baseline"
  version: 1

chunking:
  strategy: "fixed_character"
  chunk_size: 800
  overlap: 150

tokenization:
  lowercase: true

retrieval:
  method: "bm25"
  top_k: 5

bm25:
  k1: 1.5
  b: 0.75

abstention:
  enabled: true
  strategy: "top_score_threshold"
  threshold: 0.0

evaluation:
  k_values: [1, 3, 5, 10]
  split: "train"
